apiVersion: v1
kind: ConfigMap
metadata:
  name: opencargo-config
  labels:
    app: opencargo
data:
  config.toml: |
    [server]
    bind = "0.0.0.0:6789"
    base_url = "https://registry.example.com"
    storage_path = "/data/storage"

    [database]
    url = "sqlite:/data/db/opencargo.db?mode=rwc"

    [auth]
    anonymous_read = true

    # Publish target. Clients declare auth tokens for both /npm-all/ and /npm-private/.
    [[repositories]]
    name = "npm-private"
    type = "hosted"
    format = "npm"
    visibility = "private"

    [[repositories]]
    name = "npm-proxy"
    type = "proxy"
    format = "npm"
    visibility = "public"
    upstream = "https://registry.npmjs.org"

    # Single read endpoint: private first, then the public proxy.
    [[repositories]]
    name = "npm-all"
    type = "group"
    format = "npm"
    visibility = "private"
    members = ["npm-private", "npm-proxy"]

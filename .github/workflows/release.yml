name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'src/**'
      - 'frontend/**'
      - 'scripts/release/**'
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
      tags: ${{ steps.meta.outputs.tags }}
      source_digest: ${{ steps.meta.outputs.source_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        run: scripts/release/meta.sh "$TAG"
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [meta, frontend]
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - run: scripts/release/build-musl.sh "$TARGET" "$VERSION" dist
      - run: scripts/release/smoke.sh "dist/opencargo-$VERSION-$TARGET" "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/opencargo-${{ needs.meta.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3

  sbom:
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release/sbom.sh "$VERSION" dist
        env:
          VERSION: ${{ needs.meta.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [meta, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - run: scripts/release/checksums.sh dist
      - run: test "$(wc -l < dist/SHA256SUMS)" -eq 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  sign:
    if: github.event_name == 'push'
    needs: [meta, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: scripts/release/sign-blobs.sh dist "$GITHUB_REF_NAME"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/opencargo-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl
          sbom-path: dist/opencargo-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl.cdx.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/opencargo-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-musl
          sbom-path: dist/opencargo-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-musl.cdx.json
          create-storage-record: false
      - run: scripts/release/verify-assets.sh dist "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 3

  # Third-party scanner, public image by digest: no token, no OIDC, nothing to steal.
  scan:
    if: github.event_name == 'push'
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/akarasso/opencargo@${{ needs.meta.outputs.source_digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache: 'false'

  image:
    if: github.event_name == 'push'
    # No tag moves unless every blob is signed and attested and the digest re-scanned.
    needs: [meta, assemble, sign, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DIGEST: ${{ needs.meta.outputs.source_digest }}
      TAGS: ${{ needs.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/release/promote-image.sh verify-source "$SOURCE_DIGEST" "$GITHUB_SHA"
      - run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "ghcr.io/akarasso/opencargo@$SOURCE_DIGEST"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - run: scripts/release/image-sbom.sh "$SOURCE_DIGEST" sbom/image-os.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/akarasso/opencargo
          subject-digest: ${{ needs.meta.outputs.source_digest }}
          sbom-path: sbom/image-os.cdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/akarasso/opencargo
          subject-digest: ${{ needs.meta.outputs.source_digest }}
          sbom-path: sbom/opencargo-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl.cdx.json
          push-to-registry: true
          create-storage-record: false
      - run: scripts/release/verify-image.sh "$GITHUB_REF_NAME" "$SOURCE_DIGEST" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/release/promote-image.sh tag "$SOURCE_DIGEST" "$TAGS"

  release:
    if: github.event_name == 'push'
    needs: [meta, sign, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: dist
      - run: scripts/release/publish-release.sh "$GITHUB_REF_NAME" "$PRERELEASE" "$LATEST" "$SOURCE_DIGEST" dist
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          LATEST: ${{ needs.meta.outputs.latest }}
          SOURCE_DIGEST: ${{ needs.meta.outputs.source_digest }}

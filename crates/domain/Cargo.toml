[package]
name = "opencargo-domain"
version = "0.1.0-rc.1"
edition = "2021"
description = "Registry semantics for opencargo: types and pure functions, no I/O"
license = "MIT"

# Vocabulary only. Anything else -- a driver, a transport, a runtime -- is a
# layering mistake the compiler now refuses, and scripts/boundary.sh reads this
# list back through `cargo tree` (designs-next/ports-and-adapters.md 4.2).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

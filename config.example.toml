[server]
bind = "127.0.0.1:6789"
base_url = "http://localhost:6789"
storage_path = "./data/storage"

[storage]
backend = "fs"

[database]
url = "sqlite:./data/db/opencargo.db"

[auth]
anonymous_read = true
token_prefix = "trg_"
# Static tokens are break-glass credentials granted FULL ADMIN access
# (see src/auth/middleware.rs). Keep this empty in real deployments and use
# per-user tokens instead. NEVER ship a known value such as "test-token".
static_tokens = []

[auth.admin]
username = "admin"
# "admin" and "changeme" are rejected on purpose: if a weak value is left here,
# opencargo generates a random password at first boot and forces a change
# (must_change_password). Set a strong password, or supply it out-of-band via
# the OPENCARGO_ADMIN_PASSWORD environment variable.
password = "admin"

[auth.sso]
password_mode = "enabled"

[proxy]
default_ttl = "24h"
negative_cache_ttl = "1h"
connect_timeout = "10s"

[[repositories]]
name = "npm-private"
type = "hosted"
format = "npm"
visibility = "private"

# The rules below are written into an EMPTY rule table, once. Afterwards the
# API owns them: a rule deleted through it does not come back, and a pattern
# hardened here is not applied -- the startup log names the difference.
[routing]
refresh_secs = 30
max_snapshot_age_secs = 300

[[routing.rules]]
name = "acme-internal"
format = "npm"
patterns = ["@acme/*"]
effect = "allow_members"
targets = ["npm-private"]
